<!-- ==========================================================================
     Rescue watchdog. Deliberately dependency-free and defined BEFORE the app,
     so it still works if a stale cache or a broken build stops the app booting.
     Your progress must never be trapped behind a blank page.
     ========================================================================== -->
<script>
(function () {
  var KEY = "handbook60.v1";
  function raw() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }

  function save() {
    var data = raw();
    if (!data) { alert("No saved progress found in this browser."); return; }
    try {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([data], { type: "application/json" }));
      a.download = "handbook60-rescue-" + new Date().toISOString().slice(0, 10) + ".json";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    } catch (e) { alert("Could not download. Copy this instead:\n\n" + data.slice(0, 2000)); }
  }

  window.__rescueExport = save;

  setTimeout(function () {
    if (document.querySelector(".shell")) return;              // app booted fine
    var d = document.createElement("div");
    d.setAttribute("style",
      "position:fixed;inset:0;z-index:99999;overflow:auto;padding:9vh 20px;" +
      "font:15px/1.6 system-ui,-apple-system,'Segoe UI',sans-serif;background:#0d0d0d;color:#fff");
    d.innerHTML =
      "<div style='max-width:620px;margin:0 auto'>" +
      "<h1 style='font-size:22px;margin:0 0 10px'>The app didn't finish loading</h1>" +
      "<p style='color:#c3c2b7;margin:0 0 18px'>Almost always a stale cache after an update. " +
      "<b style='color:#fff'>Your saved progress is still here and is not affected.</b></p>" +
      "<ol style='color:#c3c2b7;padding-left:22px;margin:0 0 22px'>" +
      "<li style='margin-bottom:8px'>Save a backup with the button below — do this first, always.</li>" +
      "<li style='margin-bottom:8px'>Hard reload: <b style='color:#fff'>Ctrl+Shift+R</b> " +
      "(Mac: <b style='color:#fff'>Cmd+Shift+R</b>).</li>" +
      "<li>Still broken? Clear this site's data, reload, then <b style='color:#fff'>Settings → Import backup</b>.</li>" +
      "</ol>" +
      "<button id='__rsc' style='font:inherit;font-weight:600;cursor:pointer;background:#3987e5;color:#fff;" +
      "border:0;border-radius:10px;padding:11px 18px'>⭳ Download my progress</button>" +
      "<button id='__rld' style='font:inherit;cursor:pointer;background:transparent;color:#c3c2b7;" +
      "border:1px solid #3d3d3a;border-radius:10px;padding:11px 18px;margin-left:8px'>Reload</button>" +
      "<p id='__err' style='color:#918f88;font-size:12.5px;margin-top:20px;white-space:pre-wrap'></p>" +
      "</div>";
    document.body.appendChild(d);
    document.getElementById("__rsc").onclick = save;
    document.getElementById("__rld").onclick = function () { location.reload(); };
    if (window.__bootError) {
      document.getElementById("__err").textContent = "Details: " + window.__bootError;
    }
  }, 3500);

  window.addEventListener("error", function (e) {
    if (!window.__bootError) window.__bootError = (e.message || "script error") + " @ " + (e.filename || "?");
  });
})();
</script>
